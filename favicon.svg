<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D2542"/>
      <stop offset="100%" stop-color="#0D1120"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E5B8"/>
      <stop offset="55%" stop-color="#D6B25E"/>
      <stop offset="100%" stop-color="#A88432"/>
    </linearGradient>
    <linearGradient id="celadonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5EDE2"/>
      <stop offset="100%" stop-color="#7B9B74"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#D6B25E" stroke-opacity="0.52" stroke-width="1.5"/>

  <!-- Celadon grapevine leaf & tendril -->
  <path d="M12 19 C9.5 15.5, 11 11.5, 15 12 C16.5 14.5, 15 18, 12 19 Z" fill="url(#celadonGrad)" opacity="0.95"/>
  <path d="M14 16 C16 11.5, 20.5 11.5, 20 14.5 C19.6 16.5, 17 16.5, 17.5 14.8" fill="none" stroke="url(#celadonGrad)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- V as vine stem -->
  <path d="M14 21 L24 45 L33 21" fill="none" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- S as flowing wine / vine stem -->
  <path d="M48 21 C44 17, 36.5 18, 36.5 23.5 C36.5 29, 48.5 29.5, 48.5 36.5 C48.5 42.5, 40 45, 34 41.5" fill="none" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Celadon-gold grape cluster -->
  <circle cx="29.5" cy="14" r="2.2" fill="#E5EDE2"/>
  <circle cx="34.2" cy="14" r="2.2" fill="#B4CCA9"/>
  <circle cx="31.8" cy="18" r="2.1" fill="#7B9B74"/>

  <!-- Gold wine droplet -->
  <path d="M31.5 47 C31.5 47, 28 51.5, 28 53.8 C28 55.8, 29.6 57.2, 31.5 57.2 C33.4 57.2, 35 55.8, 35 53.8 C35 51.5, 31.5 47, 31.5 47 Z" fill="url(#goldGrad)"/>
</svg>
